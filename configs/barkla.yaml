# Site configuration for Barkla2 (University of Liverpool). Use it on the cluster with
#     export RTOOL_CONFIG="$HOME/Research tool/configs/barkla.yaml"
# Facts come from the Research IT documentation (2025.1) and were checked on the cluster
# with scripts/probe_barkla.sh on 2026-10-08 (see docs/barkla_runbook.md).

paths:
  runs_root: /mnt/scratch/users/${USER}/rtool/projects   # jobs must be submitted from scratch
  resources_root: /mnt/scratch/users/${USER}/rtool/resources  # datasets/models, shared by all runs
  archive_root: /users/${USER}/data/rtool-archive   # `rtool archive` (login node): data is backed up, scratch is not

knowledge:
  embedder: fastembed                     # your choice: BAAI/bge-small-en-v1.5 (~130 MB, downloaded once on Barkla)
  embedder_model: BAAI/bge-small-en-v1.5
  cache_dir: /mnt/scratch/users/${USER}/rtool/models/fastembed

llm:
  backend: vllm
  model: Qwen/Qwen3.6-35B-A3B
  served_model: qwen3.6
  # Qwen3.6 ignores /think and /no_think: thinking is switched per call with the chat template's
  # enable_thinking argument. (configs/barkla-nemotron.yaml switches back to Nemotron.)
  reasoning_control: chat_template
  # Without a server-side reasoning parser, JSON constraints would also bind the thinking,
  # so reasoning-on JSON is done in two calls: think freely, then format.
  structured_with_reasoning: false
  concurrency: 32   # llm-bench on one L40S with Nemotron: 23 tokens/s for 1 request, 160 at 8, 507 at 32; not re-measured for Qwen
  server:
    # A vLLM >= 0.19 image (the Qwen3.6 card's minimum): scripts/build_vllm_sif.sh v0.19.1. The Nemotron
    # module's image has vLLM 0.11.0, which is too old, so it is not loaded here.
    container: /mnt/scratch/users/${USER}/rtool/containers/vllm-v0.19.1.sif
    modules: [apptainer/1.3.6]
    hf_home: /mnt/scratch/users/${USER}/rtool/hf    # model weights (~72 GB BF16), downloaded once by scripts/fetch_model.sh
    home: /mnt/scratch/users/${USER}/rtool/vllm-home  # caches stay off your home; ~/.local stays hidden
    binds: [/mnt/scratch, /mnt/fastscratch]
    max_model_len: 65536
    gpu_memory_utilization: 0.90
    # Model-card flags (--language-model-only: rtool is text only), two GPUs (72 GB of weights do not fit
    # one), and eager loading: on Lustre, whole-file reads run at ~1.6 GB/s while vLLM's default
    # memory-mapped loading managed ~0.12 GB/s (3.5 min per cold start).
    # No free whitespace in constrained JSON: with it, the model sometimes finishes the object's
    # content and then emits only newlines until max_tokens (the planner's ResourcePlan, 2026-10-12:
    # 32 lines of JSON, then 8192 tokens, three tries). xgrammar reads this only from the server
    # config, and only with the backend named explicitly.
    # Tool calling for run_tool_agent / the Coder's tool_agent option: the Qwen3.6 card's own flags.
    extra_args: [--tensor-parallel-size, "2", --language-model-only, --safetensors-load-strategy, eager,
                 --structured-outputs-config, '{"backend": "xgrammar", "disable_any_whitespace": true}',
                 --enable-auto-tool-choice, --tool-call-parser, qwen3_coder]
    reasoning_parser: qwen3
    # FlashInfer's and DeepGEMM's MoE kernels JIT-compile into the read-only image (seen with Qwen3-Coder-Next
    # FP8, 2026-11-14: "Read-only file system: .../flashinfer/data/csrc"). Switching them off makes vLLM use
    # its precompiled kernels. Not yet tried with Qwen3.6 on Barkla.
    env: {VLLM_USE_FLASHINFER_MOE_FP16: "0", VLLM_USE_DEEP_GEMM: "0"}

experiments:
  # Experiments run in the Nemotron image too (Python 3.10.12, user site off). `pip list` inside it
  # on 2026-10-10: torch 2.8.0 (+ torchvision 0.23, torchaudio 2.8, CUDA 12.8), numpy 2.1.2,
  # scipy 1.15.3, transformers 4.57.1, accelerate 1.11, tokenizers 0.22, safetensors 0.6,
  # huggingface_hub 0.36, pydantic 2.12, einops, sentencepiece, pillow, networkx, PyYAML, tqdm,
  # requests. Not in it: pandas, scikit-learn, datasets, matplotlib, statsmodels; anything
  # else is pip-installed into a venv layered on the image.
  container: $NEMOTRON_SIF
  modules: [apptainer/1.3.6, nemotron/nano-12b-v2]
  binds: [/mnt/scratch, /mnt/fastscratch]
  home: /mnt/scratch/users/${USER}/rtool/exp-home   # fresh HOME: ~/.local stays out
  packages: [torch, torchvision, torchaudio, numpy, scipy, transformers, accelerate, tokenizers, safetensors,
             huggingface_hub, pydantic, einops, sentencepiece, pillow, networkx, pyyaml, tqdm, requests]
  max_parallel_runs: 4                                # GPUs one run may use at the same time

slurm:
  backend: real
  submit_roots: [/mnt/scratch, /mnt/fastscratch]
  max_jobs_in_queue: 900
  experiment_partitions: [gpu-l40s, gpu-h100, gpu-v100]   # your choice: common partitions only
  partitions:
    gpu-l40s: {gpu_type: l40s, gpus_per_node: 2, gpu_memory_gb: 48, max_time: "3-00:00:00", note: "gpu[41-44], common"}
    gpu-h100: {gpu_type: h100, gpus_per_node: 4, gpu_memory_gb: 80, max_time: "3-00:00:00", note: "gpu[31-33], common"}
    gpu-v100: {gpu_type: v100, gpus_per_node: 4, gpu_memory_gb: 16, max_time: "3-00:00:00", note: "gpu05, common"}
    # Low priority: free to use, but preempted (requeued) when the owners need them. LLM episodes only.
    gpu-l40s-low: {gpu_type: l40s, gpus_per_node: 2, gpu_memory_gb: 48, max_time: "1-00:00:00", preemptible: true, note: "gpu[45-48]"}
    gpu-a-lowsmall: {gpu_type: a40, gpu_types: [a40, a100], gpus_per_node: 2, gpu_memory_gb: 40, max_time: "1-00:00:00", preemptible: true, note: "gpu[11-16] 2x A100, gpu[21-24] 2x A40"}
    gpu-a100-lowbig: {gpu_type: a100, gpus_per_node: 3, gpu_memory_gb: 40, max_time: "1-00:00:00", preemptible: true, note: "gpu[06-09], 3-4x A100"}
    nodes: {max_time: "3-00:00:00", note: "default CPU partition, 168 cores/node"}
    short: {max_time: "1-00:00:00", note: "CPU cores of gpu[41-44]"}
    long: {max_time: "7-00:00:00", note: "4 CPU nodes"}
  episode:
    partition: gpu-l40s
    gpu_type: l40s
    # Your choice: LLM episodes need two GPUs of >= 48 GB (Qwen3.6 BF16 is ~72 GB; the 40 GB A40/A100
    # partitions are too small). Each submission asks Slurm
    # (sbatch --test-only) when each would start; the soonest wins, but an earlier entry is
    # kept if it starts within prefer_within_minutes. Preempted episodes are requeued and resume.
    gpu_choices:
      - {partition: gpu-l40s, gpu_type: l40s}
      - {partition: gpu-h100, gpu_type: h100}
      - {partition: gpu-l40s-low, gpu_type: l40s}
    prefer_within_minutes: 30
    gpus: 2
    cpu_partition: nodes
    time_limit: "08:00:00"
    modules: [apptainer/1.3.6, miniforge3/25.3.0-python3.12.10, nemotron/nano-12b-v2]
    activate: /mnt/fastscratch/users/${USER}/rtool/venv/bin/activate
    config_files: ["~/Research tool/configs/barkla.yaml"]
