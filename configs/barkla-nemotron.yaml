# Overlay: serve Nemotron Nano 12B v2 (the old default) instead of Qwen3.6-35B-A3B. Layer it AFTER
# configs/barkla.yaml, e.g. for a model comparison (docs/model_comparison.md) or to keep a run that
# started on Nemotron on it (add it to the run's slurm.episode.config_files):
#
#     rtool replay <run> --stage hypotheses --tag nemo --config "~/Research tool/configs/barkla-nemotron.yaml"
#
# Weights: RTOOL_MODEL=nvidia/NVIDIA-Nemotron-Nano-12B-v2 sbatch scripts/fetch_model.sh

llm:
  model: nvidia/NVIDIA-Nemotron-Nano-12B-v2
  served_model: nemotron
  reasoning_control: system_flag     # /think or /no_think in the system prompt
  server:
    # Expanded when the server starts, after `module load nemotron/...` sets it. The image has
    # vLLM 0.11.0, torch 2.8.0, transformers 4.57.1 and xgrammar (Python 3.10).
    container: $NEMOTRON_SIF
    modules: [apptainer/1.3.6, nemotron/nano-12b-v2]
    # Model-card flags, plus eager loading and no free whitespace in constrained JSON (as in barkla.yaml).
    # No tool-call parser: none verified for this model and vLLM build, so run_tool_agent and the Coder's
    # tool_agent option do not work with this overlay (tool calls would arrive as plain text).
    extra_args: [--trust-remote-code, --mamba_ssm_cache_dtype, float32, --safetensors-load-strategy, eager,
                 --structured-outputs-config, '{"backend": "xgrammar", "disable_any_whitespace": true}']
    # vLLM's deepseek_r1 parser needs <think>/</think> as single tokens, which this tokenizer lacks
    # (it refused to start). rtool splits the reasoning from the answer itself instead.
    reasoning_parser: null

slurm:
  episode:
    gpus: 1
    gpu_choices:
      - {partition: gpu-l40s, gpu_type: l40s}
      - {partition: gpu-h100, gpu_type: h100}
      - {partition: gpu-l40s-low, gpu_type: l40s}
      - {partition: gpu-a-lowsmall, gpu_type: a40}
      - {partition: gpu-a-lowsmall, gpu_type: a100}
      - {partition: gpu-a100-lowbig, gpu_type: a100}
