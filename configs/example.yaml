# Example rtool configuration. Every key is optional; values shown are the defaults
# unless marked "example". Unknown keys are rejected, so typos fail loudly.
#
# rtool reads, in order (later wins):
#   built-in defaults  <  $RTOOL_CONFIG (colon-separated files) or ~/.config/rtool/config.yaml
#                      <  --config FILE ...  <  --set key.path=value ...
# Strings may use ${VAR} or ${VAR:-default} to read environment variables.
# configs/barkla.yaml is the complete site profile for Barkla.

paths:
  runs_root: ~/rtool-runs                 # on Barkla: /mnt/scratch/users/${USER}/rtool/projects
  resources_root: null                    # shared datasets/models (default: inside each run)
  archive_root: null                      # where `rtool archive` writes .tar.gz files (Barkla: ~/data)

knowledge:
  embedder: hashing                       # hashing (built in, no download) | fastembed (small neural model)
  embedder_model: BAAI/bge-small-en-v1.5
  cache_dir: null

experiments:                              # how the Coder's experiment code runs
  container: null                         # Apptainer image (Barkla: $NEMOTRON_SIF); null = this Python, no installs
  python: python3                         # interpreter inside the container
  modules: [apptainer/1.3.6]              # loaded in experiment jobs
  binds: []                               # extra apptainer --bind paths
  home: null                              # fresh HOME inside the container (hides ~/.local)
  packages: []                            # importable in the image; shown to the Coder, never re-installed
  smoke_timeout_s: 900                    # one smoke run (CPU, tiny data)
  install_timeout_s: 1200                 # pip install of extra requirements (container only)
  max_parallel_runs: 4                    # array throttle: runs (GPUs) used at once

episode:
  max_minutes: 480                        # time budget of one episode (Slurm default limit is 8 h)
  gate_grace_minutes: 0                   # keep an episode alive briefly at a gate (avoids LLM cold starts)
  lease_ttl_seconds: 300                  # a crashed episode's lock expires after this

revisions:
  max_rounds: 2                           # change requests per target stage before asking a human

gates:
  default: ask                            # ask | auto
  modes:                                  # per-gate overrides (example)
    literature_review: ask
    hypothesis_selection: ask
    experiment_plan: ask
    gpu_runs: ask                         # inside the code stage, before any GPU time is spent
    final_report: ask
    revision_limit: ask

budgets:
  run:                                    # whole-run ceilings (null = unlimited)
    max_gpu_hours: null                   # experiment jobs are charged their requested GPU-hours
    max_jobs: null
  stage_default:
    max_llm_calls: null
  stages: {}                              # e.g. {literature: {max_llm_calls: 2000}}

llm:
  backend: mock                           # mock | vllm (a server per episode) | external (a URL)
  model: nvidia/NVIDIA-Nemotron-Nano-12B-v2
  base_url: null                          # for backend=external, e.g. http://127.0.0.1:8000/v1
  concurrency: 16                         # parallel requests for bulk work (Barkla: 32)
  structured_with_reasoning: true         # false: think first, then format JSON in a second call
  profiles:                               # agents name a profile, never a model
    extract: {reasoning: "off", temperature: 0.0, max_tokens: 2048}
    reason:  {reasoning: "on", temperature: 0.6, top_p: 0.95, max_tokens: 8192, thinking_budget: 4096}
    code:    {reasoning: "on", temperature: 0.6, top_p: 0.95, max_tokens: 8192, thinking_budget: 4096}
    write:   {reasoning: "off", temperature: 0.0, max_tokens: 4096}
    judge:   {reasoning: "on", temperature: 0.6, top_p: 0.95, max_tokens: 4096, thinking_budget: 2048, samples: 3}
    # each profile also takes presence_penalty / frequency_penalty (they count generated tokens only)
  server:                                 # backend=vllm: how an episode starts its own server
    container: null                       # Apptainer image with vLLM (Barkla: $NEMOTRON_SIF)
    hf_home: null                         # Hugging Face cache with the weights (read offline)
    home: null                            # HOME inside the container
    reasoning_parser: deepseek_r1         # Barkla: null (Nemotron v2's tokenizer has no single <think> token)

slurm:
  backend: fake                           # fake | real
  experiment_partitions: []               # where experiments may run (Barkla: gpu-l40s, gpu-h100, gpu-v100)
  episode:
    partition: gpu-l40s                   # LLM episodes, unless gpu_choices offers a sooner start
    gpu_type: l40s
    gpu_choices: []                       # e.g. [{partition: gpu-l40s-low, gpu_type: l40s}, ...]
    prefer_within_minutes: 30             # keep an earlier choice unless a later one starts this much sooner
    cpu_partition: nodes                  # episodes that need no LLM
