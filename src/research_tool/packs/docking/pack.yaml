name: docking
description: >-
  Molecular docking and virtual screening (protein-ligand poses and scores), compared across seeds.
smoke: >-
  When smoke is True, dock at most 3 ligands with the smallest search effort through the same code path,
  so the run takes seconds on a CPU.
packages: [numpy]
resource_sources: [pdb, alphafold, url, local, pip]
literature_sources: [pubmed, europe_pmc, semantic_scholar, openalex]
review_checks:
  - Was the docking protocol checked by redocking a known ligand into its crystal structure (pose RMSD)?
  - Are actives compared with matched decoys, so enrichment is not an artefact of molecular size or charge?
  - Are docking scores presented as rankings rather than binding affinities?
hints:
  - Load structures only from the local paths in `resources`; never download. rdkit, meeko and vina are not in the image; list them on the `# requirements:` line (or the site gives this pack its own image).
  - The seed must matter: pass it to the docking search (for example Vina's seed) and to any sampling of ligands.
