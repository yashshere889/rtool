[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-tool"
version = "0.1.0"
description = "Resumable, human-gated multi-agent research pipeline for Slurm/HPC clusters, backed by a local LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]  # httpx: FastAPI's TestClient (tests/web)
# Installed on Barkla only (the code falls back to the standard library without them).
barkla = [
  "numpy>=1.26",         # fast vector math for embeddings / clustering
  "pymupdf4llm>=0.0.17", # PDF -> Markdown with reading order (PyMuPDF is AGPL; fine for research use)
  "fastembed>=0.4",      # small CPU (ONNX) embedding models; downloads the model on first use
  "huggingface_hub>=0.24", # dataset/model downloads for experiments
  "ruff>=0.6",            # the Coder's undefined-name check on generated code (skipped without it)
]

# The web UI (`rtool ui`). Its built frontend ships in research_tool/web/static, so no Node is needed to run it.
web = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.scripts]
rtool = "research_tool.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_tool = [
  "pipelines/*.yaml",
  "agents/*/prompts/*.j2",
  "agents/coder/harness/*.py",
  "packs/*/pack.yaml",
  "packs/*/templates/*.j2",
  "packs/*/prompts/*/*.j2",
  "web/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not barkla'"
markers = ["barkla: needs the real Barkla cluster (deselected by default)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option(...) in argument defaults is the Typer idiom
